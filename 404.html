<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Shreeshail S P</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' font-family='Arial' font-weight='bold' fill='%237c3aed'%3ES%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
        .error-wrap {
            min-height: 100vh;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 40px 24px;
        }
        .error-code {
            font-family: var(--font-display);
            font-size: clamp(6rem, 18vw, 12rem);
            font-weight: 800;
            line-height: 1;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -4px;
            margin-bottom: 16px;
        }
        .error-title {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 700;
            margin-bottom: 12px;
        }
        .error-text {
            color: var(--text-muted);
            max-width: 500px;
            margin: 0 auto 32px;
        }
        .error-mono {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 32px;
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="error-wrap">
        <div>
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-text">
                This route never made it past the Bronze layer. Let's get you back to the Gold mart.
            </p>
            <a href="index.html" class="btn btn-primary">
                <i class="fas fa-home" style="margin-right: 8px;"></i> Back to Home
            </a>
            <p class="error-mono">// Error: route_not_found — check the pipeline and try again</p>
        </div>
    </div>
</body>
</html>
